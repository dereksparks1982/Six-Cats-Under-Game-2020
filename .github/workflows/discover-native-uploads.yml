name: Discover original native itch uploads

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discover-native-uploads.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public itch metadata
        run: |
          set -euxo pipefail
          UA='Mozilla/5.0 Six-Cats-Under-Preservation'
          BASE='https://teambeanloop.itch.io/six-cats-under'
          curl -fL --retry 3 -A "$UA" "$BASE" -o /tmp/page.html
          curl -fL --retry 3 -A "$UA" "$BASE/data.json" -o /tmp/data.json
          echo '===== DATA.JSON ====='
          cat /tmp/data.json
          echo
          echo '===== NATIVE FILE / UPLOAD-ID CLUES ====='
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('/tmp/page.html').read_text(errors='replace')
          needles = ['Six Cats Under - Windows.zip', 'Six Cats Under - Linux.zip', 'Six Cats Under.app.zip']
          for needle in needles:
              print('\n###', needle)
              pos = text.find(needle)
              if pos < 0:
                  print('not found')
                  continue
              chunk = text[max(0, pos-1200):pos+1200]
              chunk = re.sub(r'\s+', ' ', chunk)
              print(chunk)
          print('\n### upload ids found globally')
          ids = sorted(set(re.findall(r'(?:upload_id|upload-id|data-upload_id|data-upload-id)[^0-9]{0,30}([0-9]{3,})', text, re.I)))
          print('\n'.join(ids) if ids else '(none)')
          PY

      - name: Probe public file endpoints
        run: |
          set -u
          UA='Mozilla/5.0 Six-Cats-Under-Preservation'
          BASE='https://teambeanloop.itch.io/six-cats-under'
          for ID in 2267563 2267557 2267627; do
            echo
            echo "===== POST $BASE/file/$ID ====="
            curl -sS -D - -o /tmp/body "${BASE}/file/${ID}" \
              -X POST -A "$UA" \
              -H 'Accept: application/json, text/javascript, */*; q=0.01' \
              -H 'X-Requested-With: XMLHttpRequest' \
              -H "Referer: $BASE" || true
            echo '----- BODY -----'
            cat /tmp/body || true
            echo
          done
